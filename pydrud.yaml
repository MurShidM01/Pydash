# Pydrud project configuration
# This is the source of truth for the generated Android project. Edit it,
# then run `pydrud sync`; do not hand-edit generated Android build files.
app_name: "Pydash"
package: "com.pydrud.pydash"
version_code: 1
version_name: "1.0.0"

# Android SDK and native targets
min_sdk: 24
target_sdk: 36
compile_sdk: 36
ndk: "28.2.13676358"
abi_filters:
  - "arm64-v8a"
  - "armeabi-v7a"
  - "x86_64"

# Android application behavior
assets_dir: "assets"
scheme: "pydash"
app_links_host: ""
permissions:
