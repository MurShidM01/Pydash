# Pydrud project configuration.
# This file is the source of truth for the generated Android project. Edit it
# and run `pydrud sync`; never hand-edit the generated files under android/.
app_name: "Pydash"
package: "com.pydrud.pydash"
version_code: 3
version_name: "1.0.4"
runtime: "chaquopy"

# Android SDK and native targets
min_sdk: 24
target_sdk: 36
compile_sdk: 36
ndk: "28.2.13676358"
abi_filters:
  - "arm64-v8a"
  - "armeabi-v7a"
  - "x86_64"

# Emit one APK per ABI (plus a universal APK) instead of a single universal
# APK. Split APKs are a fraction of the size, so users download only their
# device's ABI. `pydrud build` then writes several APKs into the output dir.
abi_splits: true

# Android application behavior
assets_dir: "assets"
scheme: "pydash"
app_links_host: ""
permissions:
  - "CAMERA"
capabilities:
  - "haptics"
  - "notifications"
firebase: false
shrink: false

# Camera stack (CameraPreview, page.camera, barcode/QR scanning). Required for
# Pydash's QR scanner; ships CameraX + ML Kit native libraries.
camera: true

# Android build toolchain
python_version: "3.11"
chaquopy_version: "17.0.0"
agp_version: "8.13.2"
gradle_version: "8.14.4"

# Framework and renderer protocol metadata
framework_version: "2.1.4"
protocol_version: 2
pydrud_version: "2.1.4"
