  - "haptics"
  - "notifications"
firebase: false
shrink: false

# Generated runtime and Android build toolchain
python_version: "3.11"
framework_version: "2.0.2"
protocol_version: 2
chaquopy_version: "17.0.0"
agp_version: "8.13.2"
gradle_version: "8.14.4"

# Managed by `pydrud sync`; it records which release generated Android.
pydrud_version: "2.0.2"
